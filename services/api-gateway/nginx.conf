events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Upstream Polyglot Microservices
    upstream ai_service {
        server ai-service:8001;
    }

    upstream order_service {
        server order-service:8002;
    }

    upstream notification_service {
        server notification-service:8003;
    }

    upstream payment_service {
        server payment-service:8004;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Global CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        # 1. Python AI & Semantic Search Microservice
        location /api/v1/ai/ {
            proxy_pass http://ai_service/api/v1/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Go (Golang) Order & Escrow Microservice
        location /api/v1/orders {
            proxy_pass http://order_service/api/v1/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Node.js/TypeScript Notification Microservice
        location /api/v1/notifications {
            proxy_pass http://notification_service/api/v1/notifications;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Java Spring Boot Payment & Billing Microservice
        location /api/v1/payments/ {
            proxy_pass http://payment_service/api/v1/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Gateway Health Probe
        location /healthz {
            return 200 '{"status":"healthy","gateway":"taskora-api-gateway"}\n';
            add_header Content-Type application/json;
        }
    }
}

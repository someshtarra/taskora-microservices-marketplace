apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-escrow-service
  namespace: taskora
  labels:
    app: order-escrow-service
    language: golang
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-escrow-service
  template:
    metadata:
      labels:
        app: order-escrow-service
    spec:
      containers:
        - name: order-escrow-service
          image: taskora/order-escrow-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          # --- Go Liveness Probe ---
          # Go native HTTP server responds in <1ms without runtime warmup.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3

          # --- Go Readiness Probe ---
          # Checks internal mutex state and ledger connection.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-escrow-service
  namespace: taskora
spec:
  selector:
    app: order-escrow-service
  ports:
    - protocol: TCP
      port: 8002
      targetPort: http

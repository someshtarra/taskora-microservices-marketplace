apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-billing-service
  namespace: taskora
  labels:
    app: payment-billing-service
    language: java
    framework: spring-boot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-billing-service
  template:
    metadata:
      labels:
        app: payment-billing-service
    spec:
      containers:
        - name: payment-billing-service
          image: taskora/payment-billing-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: actuator
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"

          # --- Java / Spring Boot Startup Probe ---
          # CRUCIAL FOR JVM: Prevents premature pod restart while the JVM warms up,
          # loads Spring ApplicationContext, and performs JIT compilation.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            failureThreshold: 20
            periodSeconds: 3

          # --- Java / Spring Boot Liveness Probe ---
          # Active ONLY after startupProbe succeeds.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: actuator
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # --- Java / Spring Boot Readiness Probe ---
          # Verifies Spring database connection pool, HikariCP, and external payment gateway readiness.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: actuator
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payment-billing-service
  namespace: taskora
spec:
  selector:
    app: payment-billing-service
  ports:
    - protocol: TCP
      port: 8004
      targetPort: actuator

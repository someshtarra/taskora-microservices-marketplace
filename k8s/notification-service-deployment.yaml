apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: taskora
  labels:
    app: notification-service
    language: nodejs
    runtime: typescript
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: taskora/notification-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          # --- Node.js Liveness Probe ---
          # Verifies Node event loop is unblocked and heap memory is within limits.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # --- Node.js Readiness Probe ---
          # Verifies WebSocket connection listener and event bus subscriptions are active.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: taskora
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 8003
      targetPort: http

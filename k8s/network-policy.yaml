apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taskora-network-policy
  namespace: taskora
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. Allow traffic to API Gateway from Ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80

    # 2. Allow API Gateway to route to internal microservices
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8003
        - protocol: TCP
          port: 8004

    # 3. Allow Order Service (Go) to call Payment Service (Java) for escrow calculation
    - from:
        - podSelector:
            matchLabels:
              app: order-escrow-service
      ports:
        - protocol: TCP
          port: 8004

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow internal Pod-to-Pod communication within taskora namespace
    - to:
        - podSelector: {}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskora-ingress
  namespace: taskora
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "notification-service"
spec:
  tls:
    - hosts:
        - marketplace.taskora.io
      secretName: taskora-tls-secret
  rules:
    - host: marketplace.taskora.io
      http:
        paths:
          # Frontend SPA static route
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80

          # Python AI & Search Microservice
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: ai-search-service
                port:
                  number: 8001

          # Go Order & Escrow Microservice
          - path: /api/v1/orders
            pathType: Prefix
            backend:
              service:
                name: order-escrow-service
                port:
                  number: 8002

          # Node.js WebSocket & Notification Microservice
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8003

          # Java Spring Boot Payment & Billing Microservice
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: payment-billing-service
                port:
                  number: 8004
